name: build
# Собирает ZIP для Chrome Web Store при каждом изменении расширения или списка серверов.
# Бот пишет servers.json -> сборка запускается сама -> свежий ZIP лежит в Releases.
on:
  push:
    branches: [main]
    paths: ['extension/**', 'servers.json', 'store/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка и сборка
        run: |
          python3 - <<'PY'
          import json, sys
          s = json.load(open('servers.json'))
          json.load(open('extension/manifest.json'))
          bad = [x for x in s['servers'] if 'REPLACE' in json.dumps(x)]
          if not s['servers'] or bad:
              sys.exit('servers.json пуст или содержит заглушки REPLACE — для магазина нужен хотя бы один рабочий сервер')
          PY
          cp servers.json extension/servers.json          # в ZIP всегда попадает актуальный список серверов
          echo "VERSION=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")" >> "$GITHUB_ENV"
          echo "COUNT=$(python3 -c "import json;print(len(json.load(open('servers.json'))['servers']))")" >> "$GITHUB_ENV"
          mkdir dist
          (cd extension && zip -qr ../dist/mikaela-vpn-chrome.zip . -x '*.DS_Store')
          (cd store && zip -q ../dist/store-assets.zip *.png)
          unzip -l dist/mikaela-vpn-chrome.zip | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: mikaela-vpn-chrome
          path: dist/*
      - name: Релиз latest (перезаписывается)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.zip --latest \
            --title "Mikaela VPN для Chrome v${VERSION}" \
            --notes "Версия расширения ${VERSION}, серверов в списке: ${COUNT}. Коммит ${GITHUB_SHA::7}. mikaela-vpn-chrome.zip — для Chrome Web Store, store-assets.zip — скриншоты и промо-плитки."
